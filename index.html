<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>startbootstrap-homepage</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Merriweather+Sans:ital,wght@0,300..800;1,300..800&family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&display=swap"
        rel="stylesheet">
    <link href="./assests/css/base.css" rel="stylesheet" />
    <link href="./assests/css/main.css" rel="stylesheet" />
</head>

<body>

    <header class="header">
        <div class="container Flex">
            <div class="logo">
                <a class="font-heading" href="./index.html">
                    Start Bootstrap
                </a>
            </div>

            <button type="button" class="menu">
                <img src="./assests/img/icons/menu.svg" alt="menu" />
            </button>

            <nav class="list">
                <ul>
                    <li><a class="nav-link font-heading" href="#about">About</a></li>
                    <li><a class="nav-link font-heading" href="#services">Services</a></li>
                    <li><a class="nav-link font-heading" href="#portfolio">Portfolio</a></li>
                    <li><a class="nav-link font-heading" href="#contact">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>


    <main>
        <section class="hero py-6 flex-center text-white">
            <div class="container text-center">
                <div class="content-width">
                    <h1 class="text-xxl">Your Favorite Place for Free Bootstrap Themes</h1>
                    <hr class="center-line">
                    <p class="text-white-75 mb-5">
                        Start Bootstrap can help you build better websites using the Bootstrap framework! Just download a theme and start customizing, no strings attached!</p>
                    <a href="#about" class="btn btn-primary">Find Out More</a>
                </div>
            </div>
        </section>

    </main>


</body>

</html>
